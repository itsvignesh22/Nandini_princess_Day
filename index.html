<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5d8f2">
  <title>Happy Princess Day</title>
  <style>
    :root {
      /* Paste your Disneyland castle image URL here. */
      --castle-image: url("./iiage/castle.jpeg");
      --pink: #df79bd;
      --purple: #8544ad;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      background: linear-gradient(125deg, #f8d8ec 0%, #eedcff 52%, #f7cce8 100%);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      /* On the Redmi Note 10 Pro Max screenshot, the frame begins about
         17% down the webpage area after Chrome's browser bars. */
      padding: 17.3svh 4vw max(28px, env(safe-area-inset-bottom));
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Soft emoji hearts: gently float upward and softly blink in/out. */
    .heart-layer,
    .rain-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .rain-layer { z-index: 0; }
    .heart-layer { z-index: 1; }

    .floating-heart {
      position: absolute;
      bottom: -55px;
      left: var(--left);
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      font-size: var(--size);
      line-height: 1;
      opacity: 0;
      filter: drop-shadow(0 2px 5px rgba(165, 93, 190, .15));
      animation:
        floatUp var(--duration) linear var(--delay) infinite,
        softBlink 2.8s ease-in-out var(--blink-delay) infinite;
      will-change: transform, opacity;
    }

    @keyframes floatUp {
      0%   { transform: translate3d(0, 0, 0) rotate(-8deg) scale(.88); }
      25%  { transform: translate3d(13px, -25vh, 0) rotate(5deg) scale(1); }
      50%  { transform: translate3d(-10px, -50vh, 0) rotate(-5deg) scale(.94); }
      75%  { transform: translate3d(12px, -75vh, 0) rotate(7deg) scale(1.04); }
      100% { transform: translate3d(-5px, -112vh, 0) rotate(-4deg) scale(.9); }
    }

    @keyframes softBlink {
      0%, 100% { opacity: .08; }
      35%, 65% { opacity: .82; }
      50% { opacity: .98; }
    }

    /* Very light, slow rain; each drop has a slightly different delay. */
    .raindrop {
      position: absolute;
      top: -35px;
      left: var(--left);
      width: 1.5px;
      height: var(--length);
      border-radius: 99px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.8));
      opacity: 0;
      transform: rotate(9deg);
      animation: gentleRain var(--duration) linear var(--delay) infinite;
    }

    @keyframes gentleRain {
      0% { transform: translate3d(0, -30px, 0) rotate(9deg); opacity: 0; }
      12% { opacity: .42; }
      82% { opacity: .32; }
      100% { transform: translate3d(-18px, 110svh, 0) rotate(9deg); opacity: 0; }
    }

    .castle-frame, .eyebrow, h1, .enter { position: relative; z-index: 2; }

    .castle-frame {
      position: relative;
      flex: 0 0 auto;
      width: min(93vw, 690px);
      aspect-ratio: 1 / 1;
      padding: 8px;
      border: 5px solid #e887c2;
      border-radius: 35% 35% 5.5% 5.5% / 35% 35% 5.5% 5.5%;
      background: #fff;
      box-shadow: 0 7px 0 rgba(218, 105, 184, .18);
      overflow: hidden;
    }

    .castle-image {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 34% 34% 4.5% 4.5% / 34% 34% 4.5% 4.5%;
      background-color: #e9d9f1;
      background-image:
        linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,225,246,.08)),
        var(--castle-image);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .eyebrow {
      margin: 25px 0 0;
      color: #8245aa;
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-style: italic;
      font-size: clamp(23px, 6vw, 36px);
      line-height: 1.2;
      letter-spacing: .3px;
      text-align: center;
      white-space: nowrap;
    }

    h1 {
      margin: 20px 0 0;
      color: #c13d91;
      font-size: clamp(34px, 8.7vw, 66px);
      line-height: 1.08;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(255,255,255,.25);
    }

    .enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin-top: 35px;
      padding: 10px 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #8750aa;
      font: 500 clamp(13px, 3.55vw, 22px)/1.4 Arial, sans-serif;
      letter-spacing: .27em;
      text-align: center;
      cursor: pointer;
      animation: buttonGlow 2.8s ease-in-out infinite;
    }

    .enter:focus-visible {
      outline: 2px solid #a34fc0;
      outline-offset: 4px;
    }

    @keyframes buttonGlow {
      0%, 100% { text-shadow: 0 0 0 rgba(174, 91, 193, 0); }
      50% { text-shadow: 0 0 10px rgba(174, 91, 193, .42); }
    }

    @media (max-width: 380px) {
      .castle-frame { width: 93vw; padding: 7px; border-width: 4px; }
      .eyebrow { font-size: 21px; }
      h1 { font-size: 8.3vw; }
      .enter { letter-spacing: .19em; }
    }

    /* Shorter screens: preserve the same order and avoid clipping. */
    @media (max-height: 700px) {
      .page { padding-top: 8svh; }
      .eyebrow { margin-top: 18px; }
      h1 { margin-top: 12px; }
      .enter { margin-top: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .floating-heart, .raindrop, .enter { animation: none; opacity: .35; }
    }
  </style>
  <script src="music.js"></script>
</head>
<body>
  <main class="page" id="welcomePage" aria-label="Happy Princess Day welcome page">
    <div class="rain-layer" id="rainLayer" aria-hidden="true"></div>
    <div class="heart-layer" id="heartLayer" aria-hidden="true"></div>

    <!-- Square castle image placeholder. Add your image URL in --castle-image above. -->
    <div class="castle-frame" aria-label="Castle image frame">
      <div class="castle-image" role="img" aria-label="Disneyland castle"></div>
    </div>

    <p class="eyebrow">✿ a royal surprise awaits ✿</p>
    <h1>Happy Princess Day</h1>
    <button class="enter" id="enterButton" type="button">TAP ANYWHERE TO ENTER</button>
  </main>

  <script>
    // Create a gentle mix of modern pink and purple heart emojis.
    const heartLayer = document.getElementById("heartLayer");
    const heartEmojis = ["💜", "🩷", "💗", "💖", "💕", "💞", "💓", "💘"];
    const heartSettings = [
      [7, 27, 0, 18], [19, 21, 2.2, 22], [31, 25, 4.6, 17],
      [43, 20, 1.1, 24], [56, 29, 5.8, 19], [68, 22, 3.4, 21],
      [81, 26, 6.5, 18], [93, 20, 2.8, 23], [13, 18, 7.2, 20],
      [37, 23, 8.4, 17], [62, 19, 9.1, 22], [87, 24, 10.3, 19], [25, 22, 11.2, 21], [49, 25, 12.4, 18],
      [73, 21, 13.1, 22], [97, 23, 14.2, 20]
    ];

    heartSettings.forEach(([left, size, delay, duration], index) => {
      const heart = document.createElement("span");
      heart.className = "floating-heart";
      heart.textContent = heartEmojis[index % heartEmojis.length];
      heart.style.setProperty("--left", left + "%");
      heart.style.setProperty("--size", size + "px");
      heart.style.setProperty("--delay", (-delay) + "s");
      heart.style.setProperty("--duration", duration + "s");
      heart.style.setProperty("--blink-delay", (index * .37) + "s");
      heartLayer.appendChild(heart);
    });

    // Build a calm, fine rain overlay with varied lengths and timings.
    const rainLayer = document.getElementById("rainLayer");
    for (let i = 0; i < 44; i++) {
      const drop = document.createElement("span");
      drop.className = "raindrop";
      drop.style.setProperty("--left", ((i * 37 + 11) % 100) + "%");
      drop.style.setProperty("--length", (12 + (i % 5) * 4) + "px");
      drop.style.setProperty("--duration", (5.8 + (i % 7) * .55) + "s");
      drop.style.setProperty("--delay", (-((i * 1.13) % 9)) + "s");
      rainLayer.appendChild(drop);
    }

    // Add the next page URL here when Page 2 is ready.
    // Example: const NEXT_PAGE_URL = "page2.html";
    const NEXT_PAGE_URL = "page2.html";

    function goToNextPage() {
      if (window.PrincessMusic) window.PrincessMusic.startFromGesture();
      if (NEXT_PAGE_URL.trim()) {
        window.location.href = NEXT_PAGE_URL;
      } else {
        // Safe placeholder until you connect the next page.
        document.getElementById("enterButton").textContent = "ADD NEXT PAGE LINK";
      }
    }

    document.getElementById("enterButton").addEventListener("click", (event) => {
      event.stopPropagation();
      goToNextPage();
    });

    document.getElementById("welcomePage").addEventListener("click", (event) => {
      if (event.target.id !== "enterButton") goToNextPage();
    });
  </script>
</body>
</html>
